# Hugo Configuration - Best Practices Setup
baseURL = 'https://lumetsberger.com'
languageCode = 'en-US'
defaultContentLanguage = 'en'
title = 'Moritz Lumetsberger'

# Build settings
enableRobotsTXT = true
enableGitInfo = false
enableEmoji = true
# No taxonomies are used, so skip the empty /tags/ and /categories/ pages
disableKinds = ["taxonomy", "term"]

# Output formats
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

# Site parameters
[params]
  description = "Building innovative solutions while sharing insights on entrepreneurship, AI, and creative workflows"
  author = "Moritz Lumetsberger"
  email = "moritz@lumetsberger.com"
  
  # Social media
  linkedin = "https://linkedin.com/in/moritz-lumetsberger"
  twitter = "https://x.com/mo_snek"
  instagram = "https://www.instagram.com/moritz.lum/"
  
  # SEO and Analytics
  googleAnalytics = "G-7WZS5M1WY6"

# Menu configuration
[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 10
  
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 20
  
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 30

# Markup configuration
[markup]
  [markup.goldmark]
    [markup.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
  
  [markup.highlight]
    style = "github"
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
    codeFences = true
    guessSyntax = true
    hl_Lines = ""
    hl_inline = false
    anchorLineNos = false
    lineAnchors = ""
    tabWidth = 4

# Development server configuration
[server]
  [[server.headers]]
    for = "/**"
    [server.headers.values]
      X-Frame-Options = "DENY"
      X-XSS-Protection = "1; mode=block"
      X-Content-Type-Options = "nosniff"
      Referrer-Policy = "strict-origin-when-cross-origin"
      Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://app.cal.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://app.cal.com; connect-src 'self' https://app.cal.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; frame-src https://app.cal.com; img-src 'self' data: https:;"
