<header class="nav">
  <a href="{{ "/" | relURL }}" class="brand">{{ site.Title }}</a>
  <nav aria-label="Main">
    {{- range site.Menus.main }}
      <a href="{{ .URL }}"{{ if or (eq .URL $.RelPermalink) (and (ne .URL "/") (hasPrefix $.RelPermalink .URL)) }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{- end }}
  </nav>
</header>
