{{ $js := resources.Get "js/site.js" }}
{{ if hugo.IsProduction }}
  {{ $js = $js | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" crossorigin="anonymous" defer></script>
{{ else }}
  <script src="{{ $js.RelPermalink }}" defer></script>
{{ end }}
