{{ define "main" }}
<section class="ab-hero">
  <div class="txt">
    <h1 class="disp" data-reveal>About <span>Me</span></h1>
    <div data-reveal>{{ .Content }}</div>
  </div>
  <img class="shot" src="/images/profiles/moritz-lumetsberger-2.jpg" alt="{{ site.Params.author }}">
</section>

<section class="sect social">
  <div class="soc-cards">
    {{ with site.Params.linkedin }}<a href="{{ . }}" target="_blank" rel="noopener noreferrer" data-reveal>{{ partial "icon.html" "linkedin" }}<b class="disp">LinkedIn</b><i aria-hidden="true">↗</i></a>{{ end }}
    {{ with site.Params.instagram }}<a href="{{ . }}" target="_blank" rel="noopener noreferrer" data-reveal>{{ partial "icon.html" "instagram" }}<b class="disp">Instagram</b><i aria-hidden="true">↗</i></a>{{ end }}
  </div>
</section>

{{ partial "connect.html" . }}
{{ end }}
