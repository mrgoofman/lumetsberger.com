{{ define "main" }}
<section class="bl-hero">
  <h1 class="disp" data-reveal>{{ .Title }}</h1>
  {{ with .Content }}<div class="intro" data-reveal>{{ . }}</div>{{ end }}
</section>

<section class="sect bl-list">
  <div class="posts">
  {{ range .Pages }}
    {{ partial "post-row.html" (dict "page" . "summary" true) }}
  {{ else }}
    <p class="sub">No posts found. Check back soon for new content!</p>
  {{ end }}
  </div>
</section>
{{ end }}
