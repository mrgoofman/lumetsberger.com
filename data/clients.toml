# "Clients I worked with" logo carousel on the homepage.
# style picks how a logo is tinted to sit on the dark background (see .logos in assets/css/site.css):
#   icon     – single-colour Simple Icons SVG, inverted to white
#   wordmark – wide wordmark, rendered small and white
#   mono     – raster logo forced to flat white
#   tinted   – raster logo kept greyscale (multi-colour marks)
#   purina   – the Purina checkerboard, greyscale and a little shorter
# Only add clients cleared for public mention; some past clients must never appear here.

